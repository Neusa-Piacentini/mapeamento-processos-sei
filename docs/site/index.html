<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processos AS-IS AGENERSA</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--fg:#1c1f23;--mut:#5c6670;--line:#dde1e6;--acc:#1f5f99;--acc2:#e8f0f8;
--alto:#1b7f4b;--alto-bg:#dff3e7;--medio:#9a6a00;--medio-bg:#fff1cc;--baixo:#6b7280;--baixo-bg:#eceef1;
--ruim:#b02a37;--ruim-bg:#f8d7da;--sel:#1f5f99}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1b1e22;--fg:#e6e8eb;--mut:#a0a8b1;--line:#30353b;--acc:#7fb3e6;--acc2:#1f2a36;--alto-bg:#163a28;--alto:#7fd3a3;--medio-bg:#3a3017;--medio:#e7c36a;--baixo-bg:#2a2e33;--baixo:#b2b8bf;--ruim-bg:#3d1c20;--ruim:#f08f99}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1e22;--fg:#e6e8eb;--mut:#a0a8b1;--line:#30353b;--acc:#7fb3e6;--acc2:#1f2a36;--alto-bg:#163a28;--alto:#7fd3a3;--medio-bg:#3a3017;--medio:#e7c36a;--baixo-bg:#2a2e33;--baixo:#b2b8bf;--ruim-bg:#3d1c20;--ruim:#f08f99}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}button{font:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px}
header.top h1{font-size:17px;margin:0;font-weight:650}
nav.main{display:flex;flex-wrap:wrap;gap:4px}
nav.main button{border:1px solid transparent;background:none;color:var(--fg);padding:5px 9px;border-radius:6px;cursor:pointer;font-size:14px}
nav.main button[aria-current="page"]{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
main{max-width:1500px;margin:0 auto;padding:16px}
h2{font-size:21px;margin:4px 0 6px}h3{font-size:16px;margin:18px 0 8px}h4{font-size:14px;margin:12px 0 4px}
p.lead{color:var(--mut);margin:0 0 12px;max-width:980px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--acc)}
.kpis{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--mut)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.alto{background:var(--alto-bg);color:var(--alto)}.medio,.média,.médio{background:var(--medio-bg);color:var(--medio)}.baixo,.baixa{background:var(--baixo-bg);color:var(--baixo)}
.alta{background:var(--ruim-bg);color:var(--ruim)}
.va{background:var(--alto-bg);color:var(--alto)}.nvn{background:var(--medio-bg);color:var(--medio)}.nva{background:var(--ruim-bg);color:var(--ruim)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;background:var(--card);position:sticky;top:0}
tr.sel td{background:var(--acc2)}tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--acc2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.proc-layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;align-items:start}
.proc-layout>*{min-width:0}
@media (max-width:1100px){.proc-layout{grid-template-columns:minmax(0,1fr)}aside.painel{position:static;max-height:none}}
.diagram{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.toolbar button,.toolbar select{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px;min-width:32px}
.toolbar button:hover{border-color:var(--acc)}.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.toolbar .zoomv{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut);min-width:44px;text-align:center}
#canvas{height:62vh;min-height:420px;background:#fff}
.diagram:fullscreen #canvas{height:calc(100vh - 92px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 10px;font-size:12px;color:var(--mut);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid #888;vertical-align:-2px;margin-right:5px;border-radius:2px}
aside.painel{background:var(--card);border:1px solid var(--line);border-radius:10px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
aside.painel,#diagram{scroll-margin-top:70px}
aside.painel .hd{padding:12px 14px;border-bottom:1px solid var(--line)}
aside.painel .hd h3{margin:0 0 4px}aside.painel .bd{padding:4px 14px 14px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 4px}.tabs button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
dl{margin:0}dt{font-size:12px;color:var(--mut);margin-top:10px;font-weight:600}dd{margin:2px 0 0}
ul.tight{margin:4px 0;padding-left:18px}ul.tight li{margin:2px 0}
.muted{color:var(--mut)}.small{font-size:12.5px}
.tempo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tempo div{background:var(--bg);border-radius:8px;padding:8px}
.tempo b{font-size:18px;display:block}
.warn{background:var(--medio-bg);color:var(--fg);border-left:3px solid var(--medio);padding:6px 9px;border-radius:4px;font-size:12.5px;margin-top:8px}
.matriz{display:grid;grid-template-columns:110px repeat(3,1fr);gap:6px}
.matriz .cel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:80px}
.matriz .eixo{font-size:12px;color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center}
.matriz .cel .op{font-size:12.5px;margin:3px 0;cursor:pointer}.matriz .cel .op:hover{text-decoration:underline}
.matriz .q1{border-color:var(--alto)}
.dw{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.oport td:first-child{min-width:220px}
.empty{padding:30px 14px;color:var(--mut);text-align:center}
.djs-element.sel-act .djs-visual>rect,.djs-element.sel-act .djs-visual>polygon,.djs-element.sel-act .djs-visual>circle{stroke:#1f5f99!important;stroke-width:4px!important}
.djs-element.lay-alto .djs-visual>rect{fill:#c9ecd6!important;stroke:#1b7f4b!important}
.djs-element.lay-medio .djs-visual>rect{fill:#ffe9b0!important;stroke:#9a6a00!important}
.djs-element.lay-baixo .djs-visual>rect{fill:#eceef1!important;stroke:#6b7280!important}
.djs-element.lay-ruim .djs-visual>rect{fill:#f5c2c7!important;stroke:#b02a37!important}
.djs-element.lay-neutro .djs-visual>rect{fill:#ffffff!important;stroke:#9aa1a9!important}
.djs-element.djs-shape[data-element-id^="t"]{cursor:pointer}
.djs-element.cam-on .djs-visual>rect{stroke:#1b7f4b!important;stroke-width:4px!important}
.djs-element.cam-off{opacity:.3}
.dist{font-variant-numeric:tabular-nums}.barra{height:6px;background:var(--line);border-radius:3px;margin-top:3px}
.barra i{display:block;height:6px;border-radius:3px;background:var(--acc)}
</style></head><body>

<script>
const DADOS = [{"codigo": "P06", "nome": "Fiscalização técnica de campo (programada e por demanda)", "escopo": "Do ciclo anual de vistorias programadas nas unidades da concessionária à ciência dos pareceres técnico e jurídico e ao sobrestamento para acompanhamento das providências", "xml": "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" xmlns:color=\"http://www.omg.org/spec/BPMN/non-normative/color/1.0\" id=\"Defs_P06\" targetNamespace=\"https://agenersa.rj.gov.br/mapeamento\" exporter=\"mapeamento-sei\" exporterVersion=\"1\">\n  <bpmn:collaboration id=\"Colab_P06\">\n    <bpmn:participant id=\"Part_P06\" name=\"P06 — Fiscalização técnica de campo (programada e por demanda) (AS-IS · 1 casos · estudo de caso)\" processRef=\"Processo_P06\" />\n  <\/bpmn:collaboration>\n  <bpmn:process id=\"Processo_P06\" isExecutable=\"false\">\n    <bpmn:documentation>Do ciclo anual de vistorias programadas nas unidades da concessionária à ciência dos pareceres técnico e jurídico e ao sobrestamento para acompanhamento das providências Fontes: Estudo de caso único SEI-480002/001314/2024 (fiscalizações programadas de 2024, Águas do Rio – Bloco 1): relatórios de fiscalização, ofícios da CASAN, Parecer CASAN 250/2025, despacho da CASAN de 30/10/2025, Parecer PROC 759/2025 e ofício de ciência de 28/08/2026.<\/bpmn:documentation>\n    <bpmn:laneSet id=\"LaneSet_P06\">\n      <bpmn:lane id=\"Lane_CASAN\" name=\"Câmara Técnica de Saneamento (CASAN)\">\n        <bpmn:flowNodeRef>s1<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>j1<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>t1<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>t2<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>t3<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>g1<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>t4<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>t6<\/bpmn:flowNodeRef>\n      <\/bpmn:lane>\n      <bpmn:lane id=\"Lane_PROC\" name=\"Procuradoria (PROC)\">\n        <bpmn:flowNodeRef>t7<\/bpmn:flowNodeRef>\n      <\/bpmn:lane>\n      <bpmn:lane id=\"Lane_SCEXEC\" name=\"Secretaria Executiva (SCEXEC)\">\n        <bpmn:flowNodeRef>j2<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>t5<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>g2<\/bpmn:flowNodeRef>\n        <bpmn:flowNodeRef>f1<\/bpmn:flowNodeRef>\n      <\/bpmn:lane>\n      <bpmn:lane id=\"Lane_EXT\" name=\"Concessionária (Águas do Rio – Bloco 1)\">\n        <bpmn:flowNodeRef>e1<\/bpmn:flowNodeRef>\n      <\/bpmn:lane>\n    <\/bpmn:laneSet>\n    <bpmn:startEvent id=\"s1\" name=\"Ciclo anual de vistorias programadas aberto\">\n      <bpmn:outgoing>F0<\/bpmn:outgoing>\n    <\/bpmn:startEvent>\n    <bpmn:exclusiveGateway id=\"j1\" name=\"\">\n      <bpmn:incoming>F0<\/bpmn:incoming>\n      <bpmn:incoming>F7<\/bpmn:incoming>\n      <bpmn:outgoing>F1<\/bpmn:outgoing>\n    <\/bpmn:exclusiveGateway>\n    <bpmn:task id=\"t1\" name=\"Agendar vistoria com a concessionária&#10;[100% de 1 casos · espera 8,5 du · 2 h]\">\n      <bpmn:documentation>freq: 100% de 1; du: 8,5; horas: 2 h; status: normal<\/bpmn:documentation>\n      <bpmn:incoming>F1<\/bpmn:incoming>\n      <bpmn:outgoing>F2<\/bpmn:outgoing>\n    <\/bpmn:task>\n    <bpmn:task id=\"t2\" name=\"Vistoriar unidade e emitir relatório de fiscalização&#10;[100% de 1 casos · espera 10,5 du · 30,5 h]\">\n      <bpmn:documentation>freq: 100% de 1; du: 10,5; horas: 30,5 h; status: perda; nota: Perda: pedido complementacao (100%), prazo concedido (100%)<\/bpmn:documentation>\n      <bpmn:incoming>F2<\/bpmn:incoming>\n      <bpmn:outgoing>F3<\/bpmn:outgoing>\n    <\/bpmn:task>\n    <bpmn:task id=\"t3\" name=\"Encaminhar lote de relatórios à concessionária&#10;[100% de 1 casos · espera 6 du · 0,8 h]\">\n      <bpmn:documentation>freq: 100% de 1; du: 6; horas: 0,8 h; status: perda; nota: Perda: prazo concedido (100%)<\/bpmn:documentation>\n      <bpmn:incoming>F3<\/bpmn:incoming>\n      <bpmn:outgoing>F4<\/bpmn:outgoing>\n    <\/bpmn:task>\n    <bpmn:intermediateCatchEvent id=\"e1\" name=\"Respostas e planos de ação da concessionária recebidos\">\n      <bpmn:incoming>F4<\/bpmn:incoming>\n      <bpmn:outgoing>F5<\/bpmn:outgoing>\n      <bpmn:messageEventDefinition id=\"Msg_e1\" />\n    <\/bpmn:intermediateCatchEvent>\n    <bpmn:exclusiveGateway id=\"g1\" name=\"Restam unidades a vistoriar no ciclo?\">\n      <bpmn:incoming>F5<\/bpmn:incoming>\n      <bpmn:outgoing>F6<\/bpmn:outgoing>\n      <bpmn:outgoing>F7<\/bpmn:outgoing>\n    <\/bpmn:exclusiveGateway>\n    <bpmn:task id=\"t4\" name=\"Analisar providências e emitir parecer técnico&#10;[100% de 1 casos · espera 106 du · 16,1 h]\">\n      <bpmn:documentation>freq: 100% de 1; du: 106; horas: 16,1 h; status: espera; nota: Espera mediana 106 du (q3 106); Perda: reiteracao (100%)<\/bpmn:documentation>\n      <bpmn:incoming>F6<\/bpmn:incoming>\n      <bpmn:outgoing>F8<\/bpmn:outgoing>\n    <\/bpmn:task>\n    <bpmn:exclusiveGateway id=\"j2\" name=\"\">\n      <bpmn:incoming>F8<\/bpmn:incoming>\n      <bpmn:incoming>F14<\/bpmn:incoming>\n      <bpmn:outgoing>F9<\/bpmn:outgoing>\n    <\/bpmn:exclusiveGateway>\n    <bpmn:task id=\"t5\" name=\"Dar ciência do parecer à concessionária&#10;[100% de 1 casos · espera 130 du · 0,6 h]\">\n      <bpmn:documentation>freq: 100% de 1; du: 130; horas: 0,6 h; status: espera; nota: Espera mediana 130 du (q3 167,5)<\/bpmn:documentation>\n      <bpmn:incoming>F9<\/bpmn:incoming>\n      <bpmn:outgoing>F10<\/bpmn:outgoing>\n    <\/bpmn:task>\n    <bpmn:exclusiveGateway id=\"g2\" name=\"Concessionária contestou a fiscalização?\">\n      <bpmn:incoming>F10<\/bpmn:incoming>\n      <bpmn:outgoing>F11<\/bpmn:outgoing>\n      <bpmn:outgoing>F12<\/bpmn:outgoing>\n    <\/bpmn:exclusiveGateway>\n    <bpmn:task id=\"t6\" name=\"Responder contestação da concessi  programadas de 2024 nas unidades da Águas do Rio – Bloco 1), com um só caminho e sem auditoria de classificador; a mediana de um caso nativo é o próprio caso, e nada aqui autoriza generalizar para o tipo de processo. O trabalho é pequeno diante do tempo: 297,7–480,3 h de trabalho estimado (hipótese, a calibrar com servidores) para um lead time de 636 du, dos quais 552 du são espera entre atividades e 84 du, execução das atividades. Dois blocos concentram a espera: 306 du sem nenhuma unidade com o processo aberto, que não se separam de processo parado (e incluem prazos dados à concessionária, que não são desperdício), e 203 du com a Procuradoria antes do Parecer 759/2025, assinado em 28/08/2026 (a data no corpo da peça é 25/06/2026), no mesmo dia em que o processo foi sobrestado. A concessionária contestou o alcance da fiscalização, e o processo terminou sobrestado, sem encerramento. A IA ajuda na conferência e na redação das peças e no controle de prazos; reduzir a espera depende de dar dono, marco e prazo-alvo a cada etapa, sobretudo à fila da Procuradoria.", "fatos_sintese": ["coorte.casos", "coorte.trilha.nativa", "coorte.n_caminhos", "critico.horas_piso", "critico.horas_teto", "critico.lead", "critico.espera_total", "critico.execucao_total", "critico.posse.SEM UNIDADE", "critico.posse.PROC", "critico.t7.1.inicio"], "leitura_metricas": "O lead time é de 636 du, que é a mediana de um caso nativo (com um caso, é o próprio caso) e também o lead mediano dos processos nativos e de todos os processos da carteira, que tem um processo só. Do lead, 552 du são espera entre atividades e 84 du, execução; as fichas dão eficiência do ciclo de 7,8–12,6% e, pelo critério das fichas (soma das esperas dominantes sobre o lead), espera dominante em 89% do tempo, com 6 passagens e 1 retorno a unidade já visitada. Por posse, 306 du ficaram sem nenhuma unidade com o processo aberto (não separável de processo parado), 203 du com a Procuradoria, 70 du com a CASAN e 57 du com a Secretaria, e a CARES teve o processo por 0 du (passagem de 20/05/2024 sem peça). A espera de resposta da concessionária é de 138 du (do ofício de lote até a resposta juntada como processo anexado, limitada ao prazo dado no ofício mais uma folga), tempo que não é desperdício da agência, e o tempo indeterminado é de 41 du (além do prazo dado, não separável de processo parado).", "fatos_leitura_metricas": ["critico.lead", "coorte.caso.lead.mediana", "carteira.processos", "carteira.lead_mediano_nativos", "carteira.lead_mediano_todos", "critico.espera_total", "critico.execucao_total", "critico.posse.SEM UNIDADE", "critico.posse.PROC", "critico.posse.CASAN", "critico.posse.SCEXEC", "critico.posse.CARES", "critico.terceiros", "critico.indeterminado", "coorte.caso.retornos.mediana", "coorte.caso.unidades_ativas.mediana", "coorte.caso.oficios.mediana"], "gargalo": {"onde": "A fila na Procuradoria antes do Parecer 759/2025: é a maior posse por unidade do caso e a maior espera antes de uma atividade, e vem depois de esperas sem nenhuma unidade com o processo antes do parecer técnico e antes da resposta à contestação, e de uma espera com a Secretaria antes da primeira ciência. Não há como saber, só pela linha do tempo, se foi fila de carga, pendência de diligência ou parecer pronto aguardando assinatura.", "evidencia": "A espera antes da ciência do parecer jurídico é de 205 du, das quais 203 du com a Procuradoria e 2 du com a Secretaria; o Parecer 759/2025 e a ciência saem em 28/08/2026, de modo que a espera aparece antes da ciência (antes do parecer, o fato registra 0 du). A data no corpo do parecer é 25/06/2026, diferente da assinatura, o que sugere intervalo de assinatura ou de juntada a confirmar com a Procuradoria. A segunda maior espera é de 106 du sem nenhuma unidade com o processo aberto, entre a última remessa de relatórios à concessionária, em 30/01/2025, e o Parecer CASAN 250/2025, de 08/07/2025: não se separa processo parado de prazo dado à concessionária. Entre as esperas ligadas a este trecho do fluxo há ainda 55 du com a Secretaria antes da ciência do parecer técnico e 24 du sem unidade antes da resposta à contestação (a lista não inclui as esperas entre vistorias).", "atividades": ["t7", "t5", "t4", "t6"], "fatos_usados": ["critico.t5.2.espera_antes", "critico.t5.2.espera_antes.PROC", "critico.t5.2.espera_antes.SCEXEC", "critico.t7.1.espera_antes", "critico.t7.1.inicio", "critico.t5.2.inicio", "critico.t4.1.espera_antes", "critico.t4.1.espera_antes.SEM UNIDADE", "critico.t3.7.inicio", "critico.t4.1.inicio", "critico.t5.1.espera_antes.SCEXEC", "critico.t6.1.espera_antes.SEM UNIDADE", "critico.posse.PROC"]}, "variabilidade": "Com um único caso não há dispersão entre processos (quartis, caminhos e laços da coorte são os do próprio caso); a variação observável é entre as ocorrências das atividades dentro do caso, e isso é limitação, não resultado: nada permite dizer o que seria o processo típico ou o crítico. O caminho é um só (n_caminhos igual a um) e tem laço: a vistoria e o ofício de lote se repetem em ciclos (6 passagens do ofício de lote de volta à vistoria, 86% das saídas do ofício de lote), o agendamento volta à vistoria em metade das saídas, e a ciência se repete duas vezes. Entre as oito ocorrências de vistoria do caso nativo, a espera antes tem mediana de 10,5 du, terceiro quartil de 21,8 du e máximo de 28 du; a execução, no caso nativo, tem mediana de 4,5 du e máximo de 35 du (a primeira rodada de vistorias), e as horas estimadas têm mediana de 30,5 h no piso e máximo de 66 h. Entre as sete remessas de lotes do caso nativo, a espera antes tem mediana de 6 du e máximo de 11 du, e a execução, mediana de 0 du e máximo de 1 du: o ofício é rápido, a variação está no intervalo até ele. Fora das medidas, os relatórios variam em qualidade: vários trazem trechos de outro caso no texto-padrão e divergências entre o corpo e o checklist anexo (por exemplo SEI 74334571 e SEI 79900134).", "fatos_variabilidade": ["coorte.casos", "coorte.n_caminhos", "coorte.t2.casos_com_laco", "coorte.t3.casos_com_laco", "coorte.transicao.t3.t2", "coorte.transicao.t3.t2.pct", "coorte.transicao.t2.t1.pct", "coorte.t5.casos_com_laco", "coorte.t2.espera_antes.n", "coorte.t2.espera_antes.mediana", "coorte.t2.espera_antes.q3", "coorte.t2.espera_antes.max", "coorte.t2.execucao.mediana", "coorte.t2.execucao.max", "coorte.t2.horas_piso.mediana", "coorte.t2.horas_piso.max", "coorte.t3.espera_antes.n", "coorte.t3.espera_antes.mediana", "coorte.t3.espera_antes.max", "coorte.t3.execucao.mediana", "coorte.t3.execucao.max"], "desperdicios": [{"tipo": "Espera", "evidencia": "Quatro esperas concentram o tempo antes de atividades decisórias: 203 du com a Procuradoria antes da ciência do parecer jurídico, 106 du sem unidade antes do parecer técnico, 55 du com a Secretaria antes da ciência do parecer técnico e 24 du sem unidade antes da resposta à contestação. A parte sem unidade não se separa de processo parado e contém prazo dado à concessionária (30 dias nos ofícios de lote), que não é desperdício; a parte com a Procuradoria e com a Secretaria é fila interna.", "atividades": ["t4", "t5", "t6", "t7"], "severidade": "alta", "fatos_usados": ["critico.t5.2.espera_antes.PROC", "critico.t4.1.espera_antes.SEM UNIDADE", "critico.t5.1.espera_antes.SCEXEC", "critico.t6.1.espera_antes.SEM UNIDADE"]}, {"tipo": "Estoque", "evidencia": "Foram 306 du sem nenhuma unidade com o processo aberto, quase metade do lead time de 636 du, e o processo terminou sobrestado, sem ato final. Parte desse tempo é o intervalo programado entre vistorias do ciclo anual (planejamento, não desperdício) e parte é o prazo dado à concessionária; o registro não separa essas partes de processo parado. Os blocos mais longos sem dono são os 28 du antes de uma vistoria e os 27 du antes de outra, no ciclo, e os 106 du antes do parecer técnico.", "atividades": ["t2", "t4", "t6"], "severidade": "alta", "fatos_usados": ["critico.posse.SEM UNIDADE", "critico.lead", "critico.t2.7.espera_antes.SEM UNIDADE", "critico.t2.8.espera_antes.SEM UNIDADE", "critico.t4.1.espera_antes.SEM UNIDADE"]}, {"tipo": "Defeitos/retrabalho", "evidencia": "Os relatórios de fiscalização têm defeitos de conteúdo que exigem conferência e podem exigir correção: trechos de outro caso no texto-padrão (município de Pomerode, a CEDAE, Bloco 04) e divergências entre o corpo e o checklist anexo nas peças SEI 74334571, SEI 79900134, SEI 80656240, SEI 79901118, SEI 74882333, SEI 72975320, SEI 86826664, SEI 86827856, SEI 82895573, SEI 79575319 e SEI 79573103; a peça SEI 89901514 indica outro número de processo (SEI-480002/001547/2024); e a peça SEI 68285969, juntada como Deliberação, é a compilação do Diário Oficial com a Deliberação 4.216/2021. A ficha registra sinal de pedido de complementação, de prazo concedido e de reiteração na vistoria e o impacto sobre o prazo é a medir.", "atividades": ["t1", "t2"], "severidade": "média", "fatos_usados": ["coorte.t2.perda.pedido_complementacao", "coorte.t2.perda.prazo_concedido", "coorte.t2.perda.reiteracao"]}, {"tipo": "Transporte", "evidencia": "O processo teve 6 passagens entre unidades, e a Secretaria ficou 57 du com ele, inclusive 55 du antes de dar ciência do parecer técnico, em despacho de 0,6–0,8 h por ocorrência nos casos nativos. Houve ainda uma passagem pela CARES, em 20/05/2024, sem peça, com 0 du de posse: passagem sem trabalho visível.", "atividades": ["t5"], "severidade": "média", "fatos_usados": ["critico.posse.SCEXEC", "critico.t5.1.espera_antes.SCEXEC", "critico.posse.CARES", "coorte.t5.horas_piso.mediana", "coorte.t5.horas_teto.mediana"]}, {"tipo": "Movimentação", "evidencia": "As respostas da concessionária entram como processos anexados, sem peça própria na árvore: para saber quando e o que a concessionária respondeu a cada lote, é preciso abrir esses processos. A espera de resposta da concessionária só é medida pela data de juntada desses processos (138 du no caso), e 41 du ficam indeterminados, não separáveis de processo parado.", "atividades": ["t3", "t4", "t6"], "severidade": "média", "fatos_usados": ["coorte.caso.oficios.mediana", "critico.indeterminado", "critico.terceiros"]}, {"tipo": "Superprocessamento", "evidencia": "Cada relatório de fiscalização traz corpo e checklist anexo, e as divergências entre os dois (peças citadas no desperdício de defeitos) sugerem preenchimento em duplicidade, hipótese a confirmar. O total de 272 laudas de relatórios em 8 ocorrências de vistoria tem mediana de 30,5–49,2 h por ocorrência nos casos nativos, e a ciência do parecer, por ocorrência, mobiliza peça de 4 laudas no total. A fração do esforço que é duplicidade é a medir.", "atividades": ["t2"], "severidade": "baixa", "fatos_usados": ["coorte.t2.horas_piso.mediana", "coorte.t2.horas_teto.mediana", "coorte.t2.espera_antes.n"]}, {"tipo": "Talento não aproveitado", "evidencia": "Os ofícios de lote, de redação padronizada, ficam com gerente: mediana de 0,8–1,1 h por ocorrência nos casos nativos, em 7 ocorrências, assinados por gerentes (7 assinaturas na ficha). Um modelo de ofício liberaria o gerente para a análise técnica, hipótese a confirmar.", "atividades": ["t3"], "severidade": "baixa", "fatos_usados": ["coorte.t3.horas_piso.mediana", "coorte.t3.horas_teto.mediana", "coorte.t3.espera_antes.n"]}], "atividades": {"t1": {"valor": "necessária sem valor", "justificativa_valor": "O agendamento é logística de acesso às unidades e comunicação ao regulado, sem análise técnica.", "potencial_ia": "baixo", "tipos_ia": ["redação assistida de minuta", "monitoramento de prazos e alertas"], "aplicacao_ia": "Gerar o ofício de agendamento a partir do calendário do ciclo anual e da lista de unidades do município ou região, e alertar quando uma unidade programada não tem agendamento.", "ganho_esperado": "Trabalho pequeno: mediana de 2–2,3 h por ocorrência nos casos nativos, em duas ocorrências (a ficha dá 4–4,5 h somadas). No caso nativo, a espera antes tem mediana de 8,5 du e máximo de 12 du, sem unidade com o processo aberto; o ofício de agendamento não aparece para todas as vistorias. O ganho é de padronização, não de espera (a medir).", "controle_humano": "A decisão do roteiro e das datas de vistoria e a assinatura do ofício.", "melhoria_lean": "Calendário único do ciclo anual com os ofícios de agendamento programados de uma vez, em vez de ofício a cada município.", "fatos_usados": ["coorte.t1.horas_piso.mediana", "coorte.t1.horas_teto.mediana", "coorte.t1.espera_antes.mediana", "coorte.t1.espera_antes.max", "critico.t1.1.espera_antes.SEM UNIDADE"]}, "t2": {"valor": "agrega valor", "justificativa_valor": "A vistoria constata as condições da unidade e fundamenta as recomendações, que são o núcleo da fiscalização.", "potencial_ia": "médio", "tipos_ia": ["verificação de conformidade", "extração de dados de documentos", "redação assistida de minuta"], "aplicacao_ia": "Conferir cada relatório antes da assinatura: comparar o corpo com o checklist anexo, apontar nome de município, concessionária, bloco ou número de processo que não pertence ao caso (texto-padrão de outro caso), e montar a minuta do relatório a partir do checklist e das fotos.", "ganho_esperado": "Trabalho: mediana de 30,5–49,2 h por ocorrência nos casos nativos, em 8 ocorrências (272 laudas na ficha; máximo de 66–124,4 h na primeira rodada, que durou 35 du de execução). A IA reduz parte da redação e o retrabalho de correção; não reduz a vistoria em campo nem a espera antes de mediana de 10,5 du nos casos nativos (a medir).", "controle_humano": "A vistoria em campo, a constatação das não conformidades, o juízo sobre a gravidade e a assinatura do relatório.", "melhoria_lean": "Um único modelo de relatório por tipo de unidade, com campos obrigatórios e sem texto-padrão herdado de outro caso, e checklist como fonte única, sem repetir no corpo.", "fatos_usados": ["coorte.t2.horas_piso.mediana", "coorte.t2.horas_teto.mediana", "coorte.t2.horas_piso.max", "coorte.t2.horas_teto.max", "critico.t2.1.execucao", "coorte.t2.espera_antes.mediana", "coorte.t2.espera_antes.n"]}, "t3": {"valor": "necessária sem valor", "justificativa_valor": "O envio do lote dá à concessionária o prazo para manifestação, que é o rito do contraditório; o ofício é padronizado.", "potencial_ia": "médio", "tipos_ia": ["redação assistida de minuta", "automação de tramitação (RPA no SEI)", "monitoramento de prazos e alertas"], "aplicacao_ia": "Gerar o ofício com os relatórios do lote anexos e o prazo, registrar a data de envio, controlar o vencimento do prazo e vincular a resposta, quando chegar como processo anexado, ao processo principal com aviso à câmara técnica.", "ganho_esperado": "Trabalho pequeno: mediana de 0,8–1,1 h por ocorrência nos casos nativos, em 7 ocorrências. A espera antes tem mediana de 6 du e máximo de 11 du nos casos nativos, e a execução, mediana de 0 du. O ganho está no controle do prazo e da resposta, que hoje não aparece com data própria (a medir).", "controle_humano": "A decisão de fechar o lote e a assinatura do ofício pelo gerente.", "melhoria_lean": "Fixar rotina de envio do lote (por exemplo, assim que o último relatório do lote é assinado) e vincular a resposta no dia em que chega.", "fatos_usados": ["coorte.t3.horas_piso.mediana", "coorte.t3.horas_teto.mediana", "coorte.t3.espera_antes.n", "coorte.t3.espera_antes.mediana", "coorte.t3.espera_antes.max", "coorte.t3.execucao.mediana"]}, "t4": {"valor": "agrega valor", "justificativa_valor": "O parecer técnico avalia o grau de atendimento das recomendações e é a base da posição da agência sobre o ciclo.", "potencial_ia": "alto", "tipos_ia": ["sumarização e linha do tempo", "verificação de conformidade", "redação assistida de minuta"], "aplicacao_ia": "Consolidar as respostas e os planos de ação da concessionária (que chegam como processos anexados) contra cada recomendação dos relatórios, em quadro de atendido, parcial e não atendido, com a linha do tempo dos lotes, e entregar a minuta do parecer.", "ganho_esperado": "Trabalho: 11,4–16,1 h por ocorrência nas estimativas da ficha, em uma ocorrência (12 laudas); nesta peça o piso supera o teto, sinal de estimativa a calibrar. A espera antes é de 106 du sem unidade, que a IA não reduz: depende de dono e de prazo para iniciar a análise.", "controle_humano": "A conclusão técnica sobre o cumprimento das recomendações e a assinatura do parecer.", "melhoria_lean": "Prazo interno para iniciar o parecer técnico depois do prazo dado à concessionária, com marco de início.", "fatos_usados": ["coorte.t4.horas_piso.mediana", "coorte.t4.horas_teto.mediana", "coorte.t4.espera_antes.mediana", "critico.t4.1.espera_antes.SEM UNIDADE"]}, "t5": {"valor": "necessária sem valor", "justificativa_valor": "Dar ciência do parecer à concessionária é exigência do contraditório; o despacho em si não acrescenta análise.", "potencial_ia": "médio", "tipos_ia": ["automação de tramitação (RPA no SEI)", "monitoramento de prazos e alertas"], "aplicacao_ia": "Disparar a ciência assim que o parecer é assinado, com o parecer anexo e acesso externo, e gerar alerta quando o parecer está pronto e a ciência não saiu ou o processo está parado em uma unidade.", "ganho_esperado": "Trabalho desprezível: mediana de 0,6–0,8 h por ocorrência nos casos nativos, em 2 ocorrências. O ganho é de espera: 55 du com a Secretaria antes da primeira ciência e 205 du antes da segunda, das quais 2 du com a Secretaria e 203 du com a Procuradoria, que o alerta de fila ajuda a tornar visível.", "controle_humano": "A decisão de dar ciência e a assinatura do ofício pela Secretaria.", "melhoria_lean": "Ciência no dia da assinatura do parecer, sem passagem da Secretaria só para encaminhar.", "fatos_usados": ["coorte.t5.horas_piso.mediana", "coorte.t5.horas_teto.mediana", "coorte.t5.espera_antes.n", "critico.t5.1.espera_antes.SCEXEC", "critico.t5.2.espera_antes", "critico.t5.2.espera_antes.SCEXEC", "critico.t5.2.espera_antes.PROC"]}, "t6": {"valor": "necessária sem valor", "justificativa_valor": "A res   if (!d.fichas) { const l = d.proc.lead_nativos_encerrados;
    return {lead: l ? Math.round(l.mediana) : '—', esp: null, pce: null, n: ativ.length, alto, nva}; }
  const c = d.fichas.processo.casos;
  const lead = c.map(x=>x.lead_du), esp = c.map(x=>x.pct_tempo_espera_dominante);

}

  Object.keys(A).forEach(id => ['cam-on','cam-off'].forEach(c => { try { canvas.removeMarker(id, c) } catch(e){} }));
  if (i === '' || i == null) return;
  const seq = new Set(d.proc.caminhos[+i].sequencia.split(' → '));
  Object.keys(A).forEach(id => { try { canvas.addMarker(id, seq.has(id) ? 'cam-on' : 'cam-off') } catch(e){} });
}
function renderCoorte(d){
  const PR = d.proc; if (!PR) return '';
  const nomes = ativs(d), au = PR.auditoria_classificador, t = PR.trilha, l = PR.lead_nativos_encerrados;
  const nuc = Object.entries(PR.atividades).filter(([,a]) => a.pct_casos >= 50).map(([k]) => nomes[k]?.nome || k);
  return `<h3>Procedimento na coorte ${sitChip(PR)}</h3>
    <div class="card"><div class="kpis"><div class="kpi"><b>${PR.casos}</b><span>processos (${t.nativa||0} com trâmite completo, ${t.migrada||0} migrados, ${t.sem||0} só com as peças)</span></div>
      <div class="kpi"><b>${l?Math.round(l.mediana):'—'}</b><span>lead time mediano dos encerrados (du${l?`; n ${l.n}`:''})</span></div>
      <div class="kpi"><b>${PR.n_caminhos}</b><span>caminhos distintos</span></div>
      ${au?`<div class="kpi"><b>${Math.round(100*au.concordancia_substantivas)}%</b><span>conferência independente por amostra (${au.substantivas} peças)</span></div>`:''}</div>
      <p class="small muted" style="margin:6px 0 0">${PR.situacao==='procedimento'?'Frequências e tempos representam o procedimento do tipo.':PR.situacao==='indicativo'?'A conferência por amostra ficou abaixo de 85%: números indicativos até a revisão do modelo.':'Menos de 5 casos: leitura de estudo de caso, não de procedimento.'} Núcleo comum (em metade dos casos ou mais): ${esc(nuc.join(' → ') || '—')}.</p></div>
    <h4>Caminhos mais frequentes</h4><div class="tablewrap"><table><thead><tr><th>#</th><th>Casos</th><th>Atividades, na ordem da primeira ocorrência</th></tr></thead><tbody>
    ${PR.caminhos.slice(0,6).map((c,i)=>`<tr class="click" data-cam="${i}"><td>${i+1}</td><td>${c.casos} (${c.pct}%)</td><td class="small">${esc(c.sequencia.split(' → ').map(x=>nomes[x]?.nome||x).join(' → '))}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Clique num caminho para destacá-lo no diagrama.</p>`;
}
function metricasCoorte(d){
  const pc = d.proc?.por_caso_nativo || {}, L = [['lead','Lead time','du'],['espera_entre_atividades','Esperas entre atividades (soma por caso)','du'],
    ['execucao_atividades','Execução das atividades (soma por caso)','du'],['horas_piso','Trabalho nas peças mapeadas (piso)','h'],['horas_teto','Trabalho nas peças mapeadas (teto)','h'],
    ['terceiros','Aguardando terceiros (confirmado)','du'],['oficios','Ofícios','ofícios'],['retornos','Retornos a unidade já visitada','retornos']].filter(([k]) => pc[k]);
  if (!L.length) return '<p class="small muted">Nenhum processo da coorte tem trâmite completo no SEI: lead time, posse e esperas por caso não são medidos.</p>';
  return `<div class="tablewrap"><table><thead><tr><th>Por processo com trâmite completo</th><th>Mediana</th><th>q1–q3</th><th>Máximo</th><th>Processos</th></tr></thead><tbody>
    ${L.map(([k,t,u])=>`<tr><td>${t}</td><td>${num(pc[k].mediana)} ${u}</td><td>${num(pc[k].q1)}–${num(pc[k].q3)}</td><td>${num(pc[k].max)}</td><td>${pc[k].n}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderAvaliacao(d){
  const av = d.avaliacao, nomeA = i => esc(ativs(d)[i]?.nome || i);
  if (!d.fichas && !av) return '';
  const P = d.fichas?.processo;
  const casos = !P ? metricasCoorte(d) : `<div class="tablewrap"><table><thead><tr><th>Caso</th><th>Lead time (du)</th><th>Trabalho (h, piso–teto)</th><th>Eficiência do ciclo (%)</th><th>Tempo em espera dominante</th><th>Passagens</th><th>Retornos</th><th>Aguardando terceiros (du)</th></tr></thead><tbody>
    ${P.casos.map(c=>`<tr><td>${esc(c.numero)} <span class="small muted">${esc(c.papel)}</span></td><td>${Math.round(c.lead_du)}</td><td>${c.trabalho_piso_h}–${c.trabalho_teto_h}</td><td>${esc(c.pce_pct)}</td><td>${c.pct_tempo_espera_dominante}%</td><td>${c.passagens}</td><td>${c.retornos}</td><td>${Math.round(c.aguardando_terceiros_du)}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Carteira do código: ${P.carteira.processos} processos SEI (${P.carteira.nativos} nativos), lead time mediano ${Math.round(P.carteira.lead_mediano_du||0)} du, ${P.carteira.com_deliberacao_pct}% com deliberação, ${P.carteira.retornos_medio} retornos em média. ${P.inventario.volume?'Volume (diagnóstico): '+esc(P.inventario.volume)+'.':''}</p>`;
  if (!av) return `<h3>Avaliação AS-IS</h3>${casos}<p class="muted">Avaliação ainda não gerada.</p>`;
  const titulo = P ? 'Métricas do fluxo de valor' : 'Métricas do fluxo de valor na coorte';
  return `<h3>Avaliação AS-IS</h3><div class="card"><p style="margin:0">${esc(av.sintese)}</p></div>
    <h4>${titulo}</h4>${casos}<p>${esc(av.leitura_metricas||'')}</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="card"><h4 style="margin-top:0">Gargalo (Teoria das Restrições)</h4><p style="margin:0"><b>${esc(av.gargalo?.onde||'—')}</b></p><p class="small" style="margin:4px 0 0">${esc(av.gargalo?.evidencia||'')}</p></div>
      <div class="card"><h4 style="margin-top:0">Variabilidade (Seis Sigma)</h4><p class="small" style="margin:0">${esc(av.variabilidade||'—')}</p></div></div>
    <h4>Desperdícios (Lean)</h4><div class="dw">${(av.desperdicios||[]).map(w=>`<div class="card"><div><b>${esc(w.tipo)}</b> <span class="chip ${nivelCls(w.severidade)}">${esc(w.severidade)}</span></div><p class="small" style="margin:6px 0 0">${esc(w.evidencia)}</p>${(w.atividades||[]).length?`<p class="small muted" style="margin:4px 0 0">Atividades: ${w.atividades.map(i=>'<a href="#" data-a="'+i+'">'+nomeA(i)+'</a>').join(' · ')}</p>`:''}</div>`).join('')}</div>
    <h4>Oportunidades priorizadas</h4><div class="tablewrap"><table class="oport"><thead><tr><th>Oportunidade</th><th>Tipo</th><th>Impacto</th><th>Esforço</th><th>Ganho esperado</th><th>Pré-requisitos e riscos</th></tr></thead><tbody>
    ${(av.oportunidades||[]).map(o=>`<tr><td><b>${esc(o.titulo)}</b><div class="small">${esc(o.descricao)}</div>${(o.atividades||[]).length?`<div class="small muted">${o.atividades.map(i=>'<a href="#" data-a="'+i+'">'+nomeA(i)+'</a>').join(' · ')}</div>`:''}</td><td>${esc(o.categoria)}</td><td><span class="chip ${nivelCls(o.impacto)}">${esc(o.impacto)}</span></td><td><span class="chip ${nivelCls(o.esforco)==='alto'?'alta':nivelCls(o.esforco)==='baixo'?'alto':'medio'}">${esc(o.esforco)}</span></td><td class="small">${esc(o.ganho_esperado)}</td><td class="small">${esc(o.prerequisitos)}<br><span class="muted">${esc(o.riscos)}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px">
      <div class="card"><h4 style="margin-top:0">Indicadores para acompanhar</h4>${lista(av.indicadores_sugeridos)}</div>
      <div class="card"><h4 style="margin-top:0">Validar com a unidade</h4>${lista(av.perguntas_validacao)}</div></div>`;
}
document.addEventListener('click', e => { const a = e.target.closest('a[data-a]'); if (a && estado.pagina==='proc'){ e.preventDefault(); selecionar(a.dataset.a, true); $('#diagram').scrollIntoView({behavior:'smooth'}); } });

// ---------------------------------------------------------------- método
function renderMetodo(){
  const st = s => s.startsWith('disponível') ? 'alto' : s.startsWith('ausente') ? 'alta' : 'medio';
  $('#app').innerHTML = `<h2>Método e dados</h2>
  <p class="lead">O mapa nasce do registro do que aconteceu no SEI, não de entrevistas: a unidade que juntou cada documento, as datas de entrada e saída de cada unidade e o conteúdo das peças. Entrevistas entram depois, para validar o desenho e calibrar o tempo de trabalho.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div class="card"><h4 style="margin-top:0">1 · Trilha</h4><p class="small" style="margin:0">Estadias de cada unidade (remessa, recebimento, conclusão) e posse do processo, que divide o tempo sem dupla contagem. Espera dominante = passagem ≥ 20 du com trabalho estimado abaixo de 5% da capacidade.</p></div>
    <div class="card"><h4 style="margin-top:0">2 · Conteúdo</h4><p class="small" style="margin:0">Leitura de cada peça produzida pela agência (gerada no SEI): tarefa, insumos, ferramentas, cálculos, testes, competências, complexidade e sinais de perda. Peças externas contam como insumo.</p></div>
    <div class="card"><h4 style="margin-top:0">3 · Modelo</h4><p class="small" style="margin:0">Fluxo canônico por processo (casos típico e crítico + trilhas dos demais processos do código), em BPMN 2.0, com cada atividade ligada às peças que a sustentam.</p></div>
    <div class="card"><h4 style="margin-top:0">4 · Avaliação</h4><p class="small" style="margin:0">Lean (8 desperdícios), fluxo de valor (lead time, trabalho, eficiência do ciclo), Teoria das Restrições (gargalo), Seis Sigma (variabilidade), análise de valor agregado, ECRS e potencial de IA por atividade.</p></div>
    <div class="card"><h4 style="margin-top:0">5 · Coorte</h4><p class="small" style="margin:0">Cada peça própria dos processos do mesmo tipo é ligada a uma atividade do fluxo (ou marcada fora do fluxo), com conferência independente por amostra fora dos casos-piloto. Daí saem a frequência de cada atividade, os caminhos, a probabilidade de cada ramo de decisão e a distribuição dos tempos (mediana e quartis). Tipo com conferência abaixo de 85% é apresentado como indicativo; com menos de 5 casos, como estudo de caso. Tipos sem casos-piloto são avaliados pelas medianas e quartis da coorte.</p></div></div>
  <h3>Disponibilidade dos dados da ficha de atividade</h3>
  <div class="tablewrap"><table><thead><tr><th>Campo</th><th>Situação</th><th>Fonte</th><th>Cobertura</th><th>Como completar</th></tr></thead><tbody>
  ${LACUNAS.map(l=>`<tr><td><b>${esc(l[0])}</b></td><td><span class="chip ${st(l[1])}">${esc(l[1])}</span></td><td class="small">${esc(l[2])}</td><td class="small">${esc(l[3])}</td><td class="small">${esc(l[4])}</td></tr>`).join('')}</tbody></table></div>
  <h3>Limites</h3><ul class="small"><li>Base do gabinete CONS-02: só processos que chegam à relatoria; Ouvidoria (1 caso) ficou fora e o processo sancionador (3 casos) é estudo de caso.</li><li>Processos que existem só como conjunto de peças, sem trâmite registrado, entram na frequência das atividades e no trabalho, mas não na espera entre unidades.</li><li>Processos físicos anteriores a nov/2019 têm trilha parcial.</li><li>Peças restritas não têm texto; entram pelo tipo.</li><li>Quem assina nem sempre é quem prepara a peça.</li></ul>`;
}
render();
</script></body></html>
